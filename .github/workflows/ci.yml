name: CI

# Every claim of "green" in this repo was a claim about Linux until a macOS run found two tests
# that could never pass there — one of which also passed vacuously, so it was hiding as well as
# failing. A matrix is the only thing that makes "green" mean green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # both platforms report, rather than the first failure cancelling the other's evidence
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # E1 exports a frozen prior commit into a fresh workspace; never resets this checkout.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The integration test never pulls. CI supplies its predeclared local fixture so the Ubuntu
      # leg must report a live Docker pass, while hosts without Docker skip loudly.
      - if: runner.os == 'Linux'
        run: docker pull alpine:3.20
      # Explicit test infrastructure only: product execution never builds or pulls images.
      # Capture IDs, not mutable tags; the same fake-provider/checker discriminator must run here.
      - if: runner.os == 'Linux'
        run: |
          docker build --target worker -t agentrig-r9b-worker -f eval/Dockerfile eval
          docker build --target checker -t agentrig-r9b-checker -f eval/Dockerfile eval
          echo "AGENTRIG_EVAL_WORKER_IMAGE=$(docker image inspect --format '{{.Id}}' agentrig-r9b-worker)" >> "$GITHUB_ENV"
          echo "AGENTRIG_EVAL_CHECKER_IMAGE=$(docker image inspect --format '{{.Id}}' agentrig-r9b-checker)" >> "$GITHUB_ENV"
          echo "AGENTRIG_EVAL_REQUIRE_DOCKER=1" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Chromium for the local reference client smoke
        if: runner.os == 'Linux'
        run: pnpm --filter @agentkitai/agentrig-cli exec playwright install --with-deps chromium
      - name: Real Chromium ACP reference client
        if: runner.os == 'Linux'
        run: pnpm exec vitest run --config vitest.web.config.ts

  windows-sandbox-none:
    runs-on: windows-latest
    env:
      AGENTRIG_CI_SANDBOX: none
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      # F3 is the Windows no-op seam proof, not a claim that POSIX process integration tests run on
      # Windows. This test uses process.platform and fails unless `none` selects the identity provider.
      - run: pnpm exec vitest run packages/cli/test/sandbox-wiring.test.ts
      # H4's raw-file/lineage validation and explicit publication gate must also work on Windows.
      - run: pnpm exec vitest run packages/memory/test/promotion-evidence.test.ts packages/memory/test/store.test.ts packages/memory/test/store-versions.test.ts packages/cli/test/memory-promotion.test.ts
      # H5b1 exercises real cross-process ingest/pin writers and portable capture/log recovery.
      - run: pnpm exec vitest run packages/memory/test/ingest-persistence.test.ts packages/memory/test/ingest.test.ts packages/memory/test/raw-pins.test.ts
      # H5b2: actual cancellation, bounded inputs and auxiliary usage must be portable too.
      - run: pnpm exec vitest run packages/memory/test/ingest-lifecycle.test.ts packages/memory/test/hooks.test.ts packages/memory/test/backend.test.ts packages/cli/test/memory-ingest-lifecycle.test.ts packages/core/test/auxiliary-usage.test.ts
      # H5c1: real writer serialization, directory identity and fault-injected rollback.
      - run: pnpm exec vitest run packages/memory/test/dream-lifecycle.test.ts packages/memory/test/dream-apply.test.ts
      # H5c2a: bounded traversal, cap failures and actual cancellation cleanup.
      - run: pnpm exec vitest run packages/memory/test/dream-scans.test.ts
      - run: pnpm exec vitest run packages/memory/test/dream-runtime.test.ts
      - run: pnpm exec vitest run packages/memory/test/dream-metadata.test.ts
      - run: pnpm exec vitest run packages/memory/test/dream-recovery.test.ts
      - run: pnpm exec vitest run packages/memory/test/persistence.test.ts
      - run: pnpm exec vitest run packages/supervisor/test/auxiliary-lifecycle.test.ts packages/core/test/auxiliary-usage.test.ts packages/cli/test/render.test.ts
      - run: pnpm exec vitest run packages/cli/test/maintenance-runtime.test.ts
      - run: pnpm exec vitest run packages/cli/test/evalset.test.ts
      - run: pnpm exec vitest run packages/cli/test/evaluation.test.ts packages/core/test/auxiliary-usage.test.ts packages/cli/test/render.test.ts
      - run: pnpm exec vitest run packages/cli/test/live-evaluation.test.ts
      # Real E1/checker subprocesses with trusted fixture transport, not Windows isolation proof.
      - run: pnpm exec vitest run packages/cli/test/session-evaluation.test.ts
      # Portable host-fixture controls only; the nightly job requires actual Linux containers.
      - run: pnpm exec vitest run packages/cli/test/nightly-structure.test.ts
      - run: pnpm exec vitest run packages/core/test/checkpointer.test.ts packages/core/test/events.test.ts packages/core/test/hooks.test.ts packages/cli/test/render.test.ts
      - run: pnpm exec vitest run packages/cli/test/checkpoint-undo.test.ts packages/cli/test/program.test.ts
      - run: pnpm exec vitest run packages/supervisor/test/abort-restore.test.ts
      - run: pnpm exec vitest run packages/core/test/h6-trace.test.ts
      - run: pnpm exec vitest run packages/memory/test/write-quality.test.ts
      - run: pnpm exec vitest run packages/memory/test/promotion-guardrails.test.ts
      - run: pnpm exec vitest run packages/core/test/mcp-pins.test.ts packages/core/test/mcp.test.ts packages/cli/test/mcp-pinning.test.ts
      - run: pnpm exec vitest run packages/cli/test/tui.test.ts -t 'MCP definition'
      - run: pnpm exec vitest run packages/supervisor/test/corroborated-progress.test.ts packages/supervisor/test/detectors.test.ts
      - run: pnpm exec vitest run packages/core/test/manifests.test.ts
      - run: pnpm exec vitest run packages/core/test/content-trust.test.ts
      - run: pnpm exec vitest run packages/core/test/provenance-assembly.test.ts
      - run: pnpm exec vitest run packages/core/test/subagent.test.ts -t 'keeps what an aborted child said'
      - run: pnpm exec vitest run packages/memory/test/procedures.test.ts packages/cli/test/procedure-candidates.test.ts
      - run: pnpm exec vitest run packages/memory/test/skill-emission.test.ts packages/cli/test/skill-emission.test.ts
      - run: pnpm exec vitest run packages/core/test/generated-skills.test.ts packages/cli/test/generated-skills-config.test.ts packages/cli/test/generated-skills-runtime.test.ts
      - run: pnpm exec vitest run packages/core/test/skill-guidance.test.ts
      - run: pnpm exec vitest run packages/core/test/extensions.test.ts packages/cli/test/extensions-runtime.test.ts
      - run: pnpm exec vitest run packages/core/test/extension-failure.test.ts
      - run: pnpm exec vitest run packages/memory/test/windows-memory-replace.test.ts
      # Repeat the original real-process regression after its full-suite execution above.
      - run: pnpm exec vitest run packages/memory/test/ingest-persistence.test.ts -t 'conserves shared facts'
      - run: pnpm exec vitest run packages/cli/test/tui.test.ts -t 'interactive dream|synchronous dream'
      - run: pnpm exec vitest run packages/core/test/shell-operation.test.ts packages/cli/test/semantic-authorization.test.ts
      - run: pnpm exec vitest run packages/core/test/context-principals.test.ts
      - run: pnpm exec vitest run packages/core/test/permission-grants.test.ts packages/cli/test/grant-runtime.test.ts packages/cli/test/tui.test.ts packages/cli/test/render.test.ts
      - run: pnpm exec vitest run packages/cli/test/scoped-approval.test.ts packages/cli/test/scoped-approval-ui.test.ts
      - run: pnpm exec vitest run packages/core/test/token-continuation.test.ts
      - run: pnpm exec vitest run packages/core/test/permission-attribution.test.ts packages/cli/test/grant-inspection.test.ts
      - run: pnpm exec vitest run packages/core/test/external-expansion.test.ts packages/supervisor/test/injection.test.ts packages/cli/test/external-expansion.test.ts
      - run: pnpm exec vitest run packages/core/test/child-grants.test.ts packages/core/test/permission-grants.test.ts packages/cli/test/child-grants-ui.test.ts packages/cli/test/child-grants-startup.test.ts packages/cli/test/tui-readiness.test.ts
      - run: pnpm exec vitest run packages/core/test/acceptance-plan.test.ts packages/cli/test/acceptance-plan.test.ts
      - run: pnpm exec vitest run packages/core/test/command-outcome.test.ts packages/supervisor/test/plan-evidence.test.ts
      - run: pnpm exec vitest run packages/supervisor/test/evidence-grading.test.ts packages/cli/test/evidence-report.test.ts
      - run: pnpm exec vitest run packages/cli/test/verification-lanes.test.ts
      - run: pnpm exec vitest run packages/cli/test/schedule.test.ts
      - run: pnpm exec vitest run packages/cli/test/heartbeat.test.ts
      - run: pnpm exec vitest run packages/cli/test/schedule-report.test.ts packages/cli/test/schedule-banner.test.ts
      - run: pnpm exec vitest run packages/core/test/post-edit-diagnostics.test.ts packages/cli/test/post-edit-diagnostics.test.ts
      - run: pnpm exec vitest run packages/core/test/agent-roles.test.ts packages/cli/test/agent-roles.test.ts
      # Real local HTTP/OAuth, exact catalogue consent, advisory prompt and ACP refusal controls.
      - run: pnpm exec vitest run packages/core/test/mcp-remote.test.ts packages/core/test/mcp-oauth.test.ts packages/cli/test/mcp-remote-runtime.test.ts packages/cli/test/mcp-login.test.ts packages/cli/test/acp-config.test.ts
      - run: pnpm exec vitest run packages/supervisor/test/diff-review.test.ts packages/cli/test/review.test.ts packages/cli/test/tui-visible.test.ts
      - run: pnpm exec vitest run packages/cli/test/ci-run.test.ts
      - run: pnpm exec vitest run packages/core/test/output-schema.test.ts packages/cli/test/output-schema.test.ts
      - run: pnpm exec vitest run packages/core/test/sandbox-denial-evidence.test.ts
      - run: pnpm exec vitest run packages/core/test/net-permission.test.ts packages/cli/test/net-permission.test.ts
      - run: pnpm exec vitest run packages/core/test/web-fetch.test.ts packages/cli/test/web-fetch.test.ts
      # Keep the 1,000-file/two-install cap fixture separate from actual npm packing.
      - run: pnpm exec vitest run packages/cli/test/packages.test.ts packages/cli/test/packages-runtime.test.ts --maxWorkers=1
      - run: pnpm exec vitest run packages/core/test/provider-conformance.test.ts packages/cli/test/provider-probe.test.ts
      - run: pnpm exec vitest run packages/cli/test/session-export.test.ts
      - run: pnpm exec vitest run packages/core/test/turn-strategy.test.ts packages/core/test/h6-trace.test.ts packages/core/test/token-continuation.test.ts packages/core/test/parallel-strategy.test.ts packages/core/test/isolated-subagents.test.ts
      - run: pnpm exec vitest run packages/core/test/advisory-prompt.test.ts packages/cli/test/acp-transport.test.ts packages/cli/test/acp-server.test.ts packages/cli/test/acp-config.test.ts packages/cli/test/acp-cli.test.ts
      - run: pnpm exec vitest run packages/core/test/questions.test.ts packages/cli/test/questions.test.ts packages/cli/test/question-acp.test.ts

      - run: pnpm exec vitest run packages/cli/test/mcp-serve.test.ts packages/cli/test/mcp-serve-runtime.test.ts packages/cli/test/mcp-serve-cli.test.ts
      - run: pnpm exec vitest run packages/core/test/thinking.test.ts packages/cli/test/thinking.test.ts packages/core/test/openai-chatgpt.test.ts packages/core/test/anthropic.test.ts packages/core/test/compaction.test.ts
      - run: pnpm exec vitest run packages/cli/test/tool-summaries.test.ts
      - run: pnpm exec vitest run packages/core/test/otel.test.ts packages/cli/test/otel.test.ts
      - run: pnpm exec vitest run packages/cli/test/web.test.ts
