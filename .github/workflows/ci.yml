name: CI

# Every claim of "green" in this repo was a claim about Linux until a macOS run found two tests
# that could never pass there — one of which also passed vacuously, so it was hiding as well as
# failing. A matrix is the only thing that makes "green" mean green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # both platforms report, rather than the first failure cancelling the other's evidence
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sandbox: workspace-write
          - os: macos-latest
            sandbox: workspace-write
          # Windows has no OS provider in R2. Running the same suite with the seam explicitly set
          # to none proves no-op is a real provider path rather than a missing-sandbox special case.
          - os: windows-latest
            sandbox: none
    runs-on: ${{ matrix.os }}
    env:
      AGENTRIG_CI_SANDBOX: ${{ matrix.sandbox }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The integration test never pulls. CI supplies its predeclared local fixture so the Ubuntu
      # leg must report a live Docker pass, while hosts without Docker skip loudly.
      - if: runner.os == 'Linux'
        run: docker pull alpine:3.20
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
